[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yapsnap"
version = "0.2.0"
description = "Snap any video URL or local audio/video into a plaintext transcript. Auto-detects the spoken language. CPU-first, offline, single command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "yapsnap" }]
keywords = ["asr", "transcription", "diarization", "speaker-diarization", "language-identification", "sherpa-onnx", "kroko", "whisper", "yt-dlp", "youtube", "tiktok", "instagram", "transcribe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "sherpa-onnx>=1.13",
    # numpy capped below 2.0: sherpa-onnx is an onnxruntime-based compiled
    # extension, and a module built against the NumPy 1.x ABI crashes at
    # import time under NumPy 2.x (pip cannot detect this — it is a binary,
    # not a dependency-metadata, conflict). 1.26 is the floor for Python 3.12
    # wheels. If sherpa-onnx is later confirmed built against the NumPy 2.x
    # ABI, raise this cap and regenerate the lock file.
    "numpy>=1.26,<2",
    # yt-dlp is deliberately UNPINNED (no upper bound, no lock entry). Sites
    # change their extractors constantly and any given release goes stale
    # within weeks, so pinning it is what breaks downloads, not what prevents
    # breakage. Always resolve to the newest release; `pip install -U yt-dlp`
    # is the standard fix for a failing URL.
    "yt-dlp",
]

[project.urls]
Homepage = "https://github.com/kouhxp/yapsnap"
Issues = "https://github.com/kouhxp/yapsnap/issues"

[project.scripts]
yapsnap = "yapsnap:main"
transcribe = "yapsnap:main"

[tool.setuptools]
packages = ["yapsnap"]

# Ship the SHA-256 model manifest INSIDE the package. yapsnap/__init__.py
# resolves it at runtime via Path(__file__).resolve().parent /
# "model_checksums.sha256"; package-data installs it into the package
# directory, so that lookup works for `pip install .`, wheels, and sdist
# installs alike. (The previous [tool.setuptools.data-files] entry installed
# it relative to sys.prefix — NOT beside the module — which is why it was
# reported missing at runtime.) requirements-lock.txt and the helper script
# are sdist-only extras carried by MANIFEST.in; they are not needed at runtime.
[tool.setuptools.package-data]
yapsnap = ["model_checksums.sha256"]
